[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nfce-mg-mensal"
version = "0.1.0"
description = "Organização mensal de XMLs NFC-e MG e integração ACBr API"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.4,<3", "cryptography>=45,<49", "defusedxml>=0.7.1,<1", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
nfce-mg = "nfce_mg.__main__:main"

[tool.setuptools.package-data]
nfce_mg = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

